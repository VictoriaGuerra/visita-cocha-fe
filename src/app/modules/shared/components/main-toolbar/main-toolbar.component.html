<ion-toolbar class="main-padding shadow-3" role="navigation" aria-label="Barra principal de navegación">
  <!-- Left section -->
  <ion-buttons *ngIf="backState"
               slot="secondary"
               class="fadeinup animation-duration-200 -ml-3">
    <div fill="clear" (click)="location.back()" class="mx-1 flex cursor-pointer">
      <ion-icon slot="start" name="chevron-back-outline" class="text-3xl" color="primary"></ion-icon>
    </div>
  </ion-buttons>

  <ion-buttons *ngIf="!backState"
               slot="secondary"
               class="fadeinup -ml-3 flex align-items-center">
    <div fill="clear" (click)="this.openSideBar('side-menu')" class="flex cursor-pointer" role="button" aria-label="Abrir menú">
      <ion-icon slot="start" name="menu-outline" class="text-4xl ml-1" color="primary"></ion-icon>
    </div>

    <div class="hidden md:block h-2rem w-auto">
      <img src="assets/images/logo/logo.svg"
          alt="Logo"
          class="h-full cursor-pointer"
          routerLink='/' role="img" aria-label="Logo Visita Cochabamba">
    </div>
  </ion-buttons>

  <!-- Title center -->
  <ion-title *ngIf="backState && this.router.url.includes('/map/view')"
             class="fadeinup animation-duration-200">
    <ion-text color="medium" class="font-normal">
      Mapa
    </ion-text>
  </ion-title>

  <ion-title *ngIf="!this.router.url.includes('/map/view')"
             class="md:hidden flex align-items-center">  
    <img src="assets/images/logo/logo.svg"
         alt="Logo"
         class="h-2rem w-auto cursor-pointer"
         routerLink='/'>
  </ion-title>

  <!-- Right section -->
  <ion-buttons *ngIf="!backState"
               slot="primary"
               class="fadeinup -ml-2">
    <section class="hidden md:flex w-fit gap-5">
      <section routerLink='/'
               [ngClass]="{'active-link-3': router.url === '/'}"
               detail-icon="false"
               class="flex align-items-center cursor-pointer gap-1">
        <ion-label color="medium">
          Inicio
        </ion-label>
      </section>
    
      <section routerLink="attractions"
                [routerLinkActive]="'active-link-3'"
                detail-icon="false"
                class="flex align-items-center cursor-pointer gap-1">
        <ion-label color="medium">
          Turismo
        </ion-label>
      </section>
    
      <section routerLink="restaurants"
                [routerLinkActive]="'active-link-3'"
                detail-icon="false"
                class="flex align-items-center cursor-pointer gap-1">
        <ion-label color="medium">
          Gastronomía
        </ion-label>
      </section>
    
      <section routerLink="map/view"
                [routerLinkActive]="'active-link-3'"
                detail-icon="false"
                class="flex align-items-center cursor-pointer gap-1">
        <ion-label color="medium">
          Mapa
        </ion-label>
      </section>
    </section>
    <!-- Notification toggle -->
    <ion-button fill="clear" (click)="toggleNotifications()" aria-label="Notificaciones" class="ml-2">
      <ion-icon name="notifications-outline"></ion-icon>
      <ion-badge *ngIf="notifStatus === 'granted'" color="success" class="ml-1">On</ion-badge>
      <ion-badge *ngIf="notifStatus === 'denied'" color="danger" class="ml-1">Off</ion-badge>
    </ion-button>
    <!-- Weather unit global toggle -->
    <ion-button fill="clear" (click)="toggleWeatherUnitGlobal()" aria-label="Unidad clima" class="ml-2">
      <ion-icon name="thermometer-outline"></ion-icon>
      <ion-label class="ml-1">
        <span *ngIf="toolbarWeatherTemp !== null">{{ toolbarWeatherTemp }}°{{ weatherUnit === 'metric' ? 'C' : 'F' }}</span>
        <span *ngIf="toolbarWeatherTemp === null">{{ weatherUnit === 'metric' ? '°C' : '°F' }}</span>
        <small *ngIf="toolbarWeatherIsMock" class="ml-1">(mock)</small>
      </ion-label>
    </ion-button>
    <!-- Google Translate -->
    <div class="ml-2">
      <app-google-translate></app-google-translate>
    </div>
  </ion-buttons>
</ion-toolbar>
