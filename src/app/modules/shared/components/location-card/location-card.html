<article class="uch-card pl-1">
  <section class="uch-card__img-container w-full bg-cover bg-center relative cursor-pointer shadow-1"
           [ngClass]="{'shadow-2': !location.coverUrl}"
           [style.background]="getBackgroundString(location.coverUrl)"
           routerLink="/detail/{{module}}/{{location.id}}">
    <section *ngIf="location.coverUrl"
             class="w-full h-full uch-background-gradient-card absolute top-0 right-0 left-0 bottom-0 z-1">
    </section>

    <section *ngIf="location?.name"
             class="px-2 mx-auto absolute z-2 mb-2 bottom-0">
      <small *ngIf="location.isFeatured"
             class="mb-1 uch-txt--yellow uppercase font-semibold"
             style="letter-spacing: 3px; font-size: 9px;">
        Destacado
      </small>

      <h3 class="uch-txt-title text-sm md:text-base uch-txt--primary uch--ellipsis-2 my-0"
          [ngClass]="{'uch-txt--white': location.coverUrl !== ''}">
        {{location.name}}
      </h3>
    </section>

    <section *ngIf="location.mainCategories[0]"
             class="absolute z-2 mt-2 mr-2 right-0 opacity-90">
      <p-tag value="{{location.mainCategories[0]}}"
             class="p-tag--secondary capitalize">
      </p-tag>
    </section>
  </section>
</article>
