<article class="uch-menu-icon w-full flex gap-5 md:gap-6">
  <section *ngFor="let item of menuItems"
           class="uch-menu-icon__item flex flex-column align-items-center cursor-pointer fadein animation-duration-300"
           routerLink="{{item.url}}">
    <ion-icon name="{{item.icon}}"
              color="primary"
              class="text-2xl">
    </ion-icon>

    <small class="mt-2 text-sm text-black-alpha-80">
      {{item.label}}
    </small>
  </section>
</article>
