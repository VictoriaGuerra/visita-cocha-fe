<article class="w-full h-full flex flex-column align-items-center justify-content-center fadein animation-duration-500">
  <ion-text color="medium">
    <h2 class="mx-auto text-center text-8xl">
      4 0 4
    </h2>

    <p class="uppercase mx-auto text-center text-3xl mt-3 font-light">
      Página no encontrada
    </p>

    <p class="w-10 sm:w-7 mx-auto text-center mt-5 font-light">
      Es posible que la URL ingresada no corresponda a ningún catálogo, si deseas ver más tiendas haz
      <span class="font-italic cursor-pointer"
            [style.color]="'var(--ion-color-primary)'"
            routerLink="/stores/all">
        click aquí
      </span>
    </p>
  </ion-text>

  <ion-button fill="solid"
              color="primary"
              class="mt-6 w-15rem"
              routerLink='/'>
    Ir al inicio
  </ion-button>
</article>
