<section>
  <section class="w-full flex justify-content-between align-items-center gap-2">
    <h3 *ngIf="title"
        class="uch-txt-title flex align-items-center gap-3 {{css}} title my-0"
        style="letter-spacing: 2px;">
      <ion-icon *ngIf="icon"
                name="{{ icon }}"
                class="text-2xl uch-txt--primary {{css}} hidden md:flex">
      </ion-icon>

      {{ title }}
    </h3>

    <div *ngIf="showLine"
         class="flex-grow-1 border-1 border-black-alpha-10 border-round-2xl">
    </div>

    <ion-button *ngIf="route"
                fill="outline"
                color="medium"
                size="small"
                routerLink="{{route}}">
      ver todo
    </ion-button>
  </section>

  <p *ngIf="description"
     class="uch-txt--black-lighten text-sm md:text-base py-2 {{cssText}}">
    {{ description }}
  </p>
</section>
