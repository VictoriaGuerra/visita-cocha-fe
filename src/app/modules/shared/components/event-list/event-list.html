<section class="events-wrapper">
  <p-carousel *ngIf="itemList"
              [numVisible]="4"
              [responsiveOptions]="responsiveOptions"
              [autoplayInterval]="5000"
              [value]="itemList">
    <ng-template let-item
                 pTemplate="item">
      <div class="event-card"
           [class.event-card-clickable]="item.link"
           (click)="openLink(item.link)">
        
        <!-- Imagen de fondo con overlay -->
        <div class="event-image"
             [style.background-image]="item.coverUrl ? 'url(' + item.coverUrl + ')' : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'">
          <div class="event-overlay"></div>
        </div>
        
        <!-- Badge del tipo de evento -->
        <div class="event-badge">
          <ion-icon name="calendar-outline"></ion-icon>
          <span>{{item.type || 'Evento anual'}}</span>
        </div>
        
        <!-- Contenido principal -->
        <div class="event-content">
          <h3 class="event-title">
            {{item.title}}
          </h3>
          
          <div *ngIf="item.location.place || item.location.address"
               class="event-location">
            <ion-icon name="location-outline"></ion-icon>
            <span>
              {{item.location.place || item.location.address}}
            </span>
          </div>
        </div>
        
        <!-- Footer con fecha y hora -->
        <div class="event-footer">
          <div class="event-date-time">
            <div class="event-time">
              <ion-icon name="time-outline"></ion-icon>
              <span>{{formatDate(item.date, 'time')}} hrs</span>
            </div>
            
            <div *ngIf="!item.link" class="event-soon">
              <span>Detalles próximamente</span>
            </div>
          </div>
          
          <div class="event-date-box">
            <div class="date-day">{{formatDate(item.date, 'day')}}</div>
            <div class="date-month">{{formatDate(item.date, 'month')}}</div>
          </div>
        </div>
      </div>
    </ng-template>
  </p-carousel>

  <section *ngIf="!itemList"
             class="w-full h-14rem md:h-19rem border-round-2xl overflow-hidden relative">
      <ion-skeleton-text [animated]="true"></ion-skeleton-text>
  </section>
</section>
