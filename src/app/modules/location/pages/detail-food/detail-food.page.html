<ion-toolbar></ion-toolbar>

<ion-content #pageTop>
  <article class="w-full main-padding flex flex-column md:flex-row py-5">
    <section class="md:w-8">
      <hero-detail [item]="item"></hero-detail>

      <h5  *ngIf="item?.ingredients"
          class="text-base title uch-txt--primary font-normal"
          style="letter-spacing: 2px;">
        Ingredientes
      </h5>

      <section *ngIf="item?.ingredients"
               class="my-3 border-bottom-2 border-gray-300 pb-4 uch-txt--black-lighten">
        <ul>
          <li *ngFor="let item of item?.ingredients"
              class="text-sm md:text-base">
            {{item}}
          </li>
        </ul>
      </section>

      <article *ngIf="item?.name">
        <list-title [title]="'¿Dónde comer ' + item?.name + '?'"
                    [css]="'uch-txt--primary'">
        </list-title>

        <section class="mt-4">
          <item-list [module]="'restaurants'"
                     [queryList]="queryList">
          </item-list>
        </section>
      </article>

      <article *ngIf="foodList.length > 0"
               class="main-padding--no-xend-padding border-round-xl pb-4 mb-3 uch-bg--grey-lighten p-3">
        <list-title [title]="'También te puede interesar'"
                    [css]="'uch-txt--secondary text-base'">
        </list-title>

        <section class="mt-3">
          <food-list [foodList]="foodList">
          </food-list>
        </section>
      </article>
    </section>

    <p-divider class="hidden md:block mx-3"
               [layout]="'vertical'">
    </p-divider>

    <section class="md:w-4 relative mt-4 md:mt-0">
      <section class="flex flex-column gap-3 sticky top-0">
        <news-list [vertical]="true"></news-list>
      </section>
    </section>
  </article>

  <app-footer></app-footer>
</ion-content>
